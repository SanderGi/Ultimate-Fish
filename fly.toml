# fly.toml app configuration file generated for ultimatefish on 2026-08-17T14:04:23-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ultimatefish'
primary_region = 'sjc'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'performance-1x'
  memory = '4gb'
  cpus = 1
  memory_mb = 4096
